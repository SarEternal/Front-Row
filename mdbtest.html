<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MDBList test</title>
<style>
:root{color-scheme:light dark;--bg:#F2F1F6;--s:#fff;--fg:#1B1A24;--m:#5F5D72;--l:#D9D7E3;--ok:#1E8A5B;--bad:#C2300F;--a:#E5372F}
@media (prefers-color-scheme:dark){:root{--bg:#0F111A;--s:#181B27;--fg:#ECEAF4;--m:#9D9BB1;--l:#2D3147;--ok:#3FB27F;--bad:#FF7A5C}}
*{box-sizing:border-box}body{margin:0;padding:20px 16px 40px;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,sans-serif}
.w{max-width:520px;margin:0 auto}h1{margin:0 0 6px;font-size:26px}p{margin:0 0 14px;color:var(--m)}
input{width:100%;height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--l);background:var(--s);color:var(--fg);font-size:16px;margin-bottom:10px}
button{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--a);color:#fff;font:700 17px system-ui,sans-serif}button:disabled{opacity:.5}
ul{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:8px}li{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere}
li b{display:block}li.ok b{color:var(--ok)}li.bad b{color:var(--bad)}li small{display:block;margin-top:3px;color:var(--m);font:12px/1.4 ui-monospace,Menlo,monospace}
</style></head><body><div class="w">
<h1>MDBList test</h1><p>Paste your MDBList key, tap the button, wait a few seconds and send me a screenshot of the whole result.</p>
<input id="k" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your MDBList key"><button id="go" type="button">Run test</button><ul id="out"></ul></div>
<script>
(function(){'use strict';var out=document.getElementById('out'),go=document.getElementById('go');
var FILMS=[['Guardians of the Galaxy Vol. 2',283995],['Dune: Part Two',693134]];
function row(t){var li=document.createElement('li');li.innerHTML='<b></b><small></small>';li.firstChild.textContent=t+' …';out.appendChild(li);
return{ok:function(n){li.className='ok';li.firstChild.textContent='✓ '+t;li.lastChild.textContent=n||''},bad:function(n){li.className='bad';li.firstChild.textContent='✗ '+t;li.lastChild.textContent=n||''}}}
async function call(u){var c=new AbortController(),t=setTimeout(function(){c.abort()},15000);try{return await fetch(u,{signal:c.signal})}finally{clearTimeout(t)}}
async function run(){var key=document.getElementById('k').value.trim();out.innerHTML='';if(!key){row('Key').bad('Paste your key first');return}go.disabled=true;
for(var f=0;f<FILMS.length;f++){var urls=[['new endpoint','https://api.mdblist.com/tmdb/movie/'+FILMS[f][1]+'?apikey='+encodeURIComponent(key)],['older endpoint','https://mdblist.com/api/?apikey='+encodeURIComponent(key)+'&tm='+FILMS[f][1]]];
for(var u=0;u<urls.length;u++){var s=row(FILMS[f][0]+' · '+urls[u][0]);
try{var r=await call(urls[u][1]);var j=null;try{j=await r.json()}catch(e){}
if(!r.ok){s.bad('HTTP '+r.status+(j&&j.error?' '+String(j.error).slice(0,80):''))}
else if(!j||!Array.isArray(j.ratings)){s.bad('HTTP 200 but no ratings list: '+JSON.stringify(j).slice(0,120))}
else{s.ok(j.ratings.map(function(x){return x.source+'='+(x.value!=null?x.value:x.score)+(x.votes?' ('+x.votes+' votes)':'')}).join('\n')||'empty ratings list')}}
catch(e){s.bad('blocked or unreachable ('+String(e&&e.message||e).slice(0,60)+')')}}}
go.disabled=false}
go.addEventListener('click',run)})();
</script></body></html>
